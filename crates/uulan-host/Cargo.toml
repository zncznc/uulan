[package]
name = "uulan-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "uulan 被控端（麒麟/Linux X11；采集走 ffmpeg 子进程，因此在任何平台都能编译与自测）"

[lib]
name = "uulan_host"
path = "src/lib.rs"

[[bin]]
name = "uulan-host"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
uulan-protocol = { workspace = true }
uulan-media = { path = "../uulan-media" }
uulan-clip = { path = "../uulan-clip" }
uulan-fs = { path = "../uulan-fs" }
uulan-bulk = { path = "../uulan-bulk" }
portable-pty = "0.9"

# 只有 unix 需要：`portable-pty` 的 kill() 是 SIGHUP，硬杀要自己发 SIGKILL。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
uulan-server = { path = "../uulan-server" }
