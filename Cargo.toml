[workspace]
resolver = "2"
members = [
    "crates/uulan-protocol",
    "crates/uulan-media",
    "crates/uulan-clip",
    "crates/uulan-fs",
    "crates/uulan-bulk",
    "crates/uulan-server",
    "crates/uulan-host",
    "crates/uulan-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# rust-version 压到 1.85：尽可能让麒麟 V10 自带的/源里的旧 cargo 也能编。
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process", "signal"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
# M6 端到端加密：只用最少的一组（X25519 交换 + HKDF 派生 + ChaCha20-Poly1305 每帧认证加密）。
x25519-dalek = { version = "2", features = ["static_secrets"] }
# PAKE（M6）：只借 curve25519-dalek 的 Ristretto255 群与哈希到群映射。
# 它本来就在依赖树里（x25519-dalek 的底层），所以内网离线打包不需要多带任何东西。
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"

uulan-protocol = { path = "crates/uulan-protocol" }
uulan-fs = { path = "crates/uulan-fs" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
